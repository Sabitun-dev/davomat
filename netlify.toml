# Netlify reads this file on every deploy.
# If any step of the build command fails, Netlify keeps the previous version live.

[build]
  command = "npm run netlify-build"
  publish = "public"

[build.environment]
  NODE_VERSION = "22"
  # Netlify's secret scanner treats every environment variable as a secret. These are plain settings
  # whose values (e.g. "Asia/Tashkent", "uz", "app") normally appear in the code, so they are skipped.
  # Real secrets (BOT_TOKEN, DATABASE_URL, WEBHOOK_SECRET, SETUP_SECRET, QR_SIGNING_SECRET) are still scanned.
  SECRETS_SCAN_OMIT_KEYS = "DEFAULT_TIMEZONE,DEFAULT_LANGUAGE,MINIAPP_SHORT_NAME,BOT_USERNAME,GROUP_CHAT_ID,OWNER_TELEGRAM_IDS,APP_URL,NODE_VERSION"

[functions]
  node_bundler = "esbuild"
  # The PDF exports need a font with Uzbek and Russian letters.
  included_files = [
    "node_modules/dejavu-fonts-ttf/ttf/DejaVuSans.ttf",
    "node_modules/dejavu-fonts-ttf/ttf/DejaVuSans-Bold.ttf",
  ]

# The Mini App is a single-page app: every /app/... address loads the same page.
[[redirects]]
  from = "/app/*"
  to = "/app/index.html"
  status = 200

[[redirects]]
  from = "/"
  to = "/app/"
  status = 302

[[headers]]
  for = "/app/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/app/index.html"
  [headers.values]
    Cache-Control = "no-cache"
